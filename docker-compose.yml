# Adopt-a-Pet: full stack with one command ->  docker compose up --build
services:

  mongo:
    image: mongo:7
    volumes:
      - mongo_data:/data/db          # keeps your data when containers restart
    ports:
      - "27017:27017"                # optional: lets you peek with MongoDB Compass

  backend:
    build: ./backend                   # also runs the dog breed model (backend/ml/mlmain.py)
    ports:
      - "5000:5000"
    env_file: .env
    environment:
      MONGO_URI: mongodb://mongo:27017/adoptapet
    volumes:
      - ./backend:/app                # live reload + lets you drop dog_breed_resnet50_weights.pth into backend/ml/
    depends_on:
      - mongo

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:5000
    volumes:
      - ./frontend:/app               # live reload while you edit
      - /app/node_modules
    depends_on:
      - backend

volumes:
  mongo_data:
